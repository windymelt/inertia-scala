name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1

      - name: Check formatting
        run: sbt scalafmtCheckAll scalafmtSbtCheck

      - name: Check scalafix rules
        run: sbt 'scalafixAll --check'

  test:
    needs: lint
    name: test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The JVM axis also verifies that the JVM-only module (cask) and the
          # examples compile. cask has no tests, but testOnly * still compiles it.
          - platform: jvm
            tasks: '"core/testOnly *" "inertia-cask/testOnly *" "inertia-tapir/testOnly *" "example-cask/compile" "example-tapir/compile"'
          - platform: js
            tasks: '"coreJS/testOnly *" "inertia-tapirJS/testOnly *"'
          - platform: native
            tasks: '"coreNative/testOnly *" "inertia-tapirNative/testOnly *"'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1

      - name: Set up Scala Native toolchain
        if: matrix.platform == 'native'
        run: sudo apt-get update && sudo apt-get install -y clang libidn2-dev

      - name: Test
        run: sbt ${{ matrix.tasks }}

  ci-passed:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.lint.result }}" = "success" && \
          test "${{ needs.test.result }}" = "success"
