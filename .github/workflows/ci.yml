name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1

      # sbt 2 joins CLI args into a single command line, so multiple
      # commands must be separated with semicolons.
      - name: Check formatting
        run: sbt scruffFmtCheck

      - name: Check scalafix rules
        run: sbt 'scalafixAll --check'

  test:
    needs: lint
    name: test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The JVM axis also verifies that the JVM-only module (cask) and the
          # examples compile. cask has no tests, but testOnly * still compiles it.
          # sbt 2 joins CLI args into a single command line, so the tasks are
          # separated with semicolons instead of being passed as separate args.
          # Coverage is measured on the JVM axis only. The examples are compiled
          # before `coverage` so that they are not instrumented.
          - platform: jvm
            tasks: 'example-cask/compile; example-tapir/compile; coverage; core/testOnly *; inertia-cask/testOnly *; inertia-tapir/testOnly *; coverageReport; coverageAggregate'
          - platform: js
            tasks: 'coreJS/testOnly *; inertia-tapirJS/testOnly *'
          - platform: native
            tasks: 'coreNative/testOnly *; inertia-tapirNative/testOnly *'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1

      - name: Set up Scala Native toolchain
        if: matrix.platform == 'native'
        run: sudo apt-get update && sudo apt-get install -y clang libidn2-dev

      - name: Test
        run: sbt '${{ matrix.tasks }}'

      # The aggregate report lives under the root project's class directory
      # (see coverageSettings in build.sbt). The Scala version in the path is
      # sbt's own, so it is matched with a glob.
      - name: Write coverage summary
        if: matrix.platform == 'jvm'
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          root = ET.parse(glob.glob("target/out/jvm/*/inertia-scala/classes/scoverage-report/scoverage.xml")[0]).getroot()
          print("## Coverage")
          print()
          print(f"Statement: **{root.get('statement-rate')}%** / Branch: **{root.get('branch-rate')}%**")
          print()
          print("| Package | Statements | Invoked | Statement rate |")
          print("|---|---:|---:|---:|")
          for p in root.iter("package"):
              print(f"| `{p.get('name')}` | {p.get('statement-count')} | {p.get('statements-invoked')} | {p.get('statement-rate')}% |")
          EOF

      - name: Upload coverage report
        if: matrix.platform == 'jvm'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            target/out/jvm/*/inertia-scala/classes/scoverage-report/
            target/out/jvm/*/inertia-scala/classes/coverage-report/
          if-no-files-found: error

  ci-passed:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.lint.result }}" = "success" && \
          test "${{ needs.test.result }}" = "success"
